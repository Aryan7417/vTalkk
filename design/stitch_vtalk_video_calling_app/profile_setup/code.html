<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VTalk - Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#303032",
                        "primary": "#ffb4aa",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "secondary-container": "#474649",
                        "outline-variant": "#5d3f3b",
                        "on-tertiary-fixed-variant": "#474649",
                        "on-tertiary-container": "#29292b",
                        "surface-container-highest": "#353534",
                        "primary-container": "#ff5545",
                        "primary-fixed-dim": "#ffb4aa",
                        "on-tertiary": "#303032",
                        "on-error": "#690005",
                        "on-primary": "#690003",
                        "on-primary-fixed": "#410001",
                        "on-primary-fixed-variant": "#930005",
                        "on-background": "#e5e2e1",
                        "inverse-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "on-surface": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "on-secondary-container": "#b6b4b7",
                        "primary-fixed": "#ffdad5",
                        "on-secondary-fixed": "#1b1b1d",
                        "tertiary": "#c8c6c8",
                        "on-primary-container": "#5c0002",
                        "error": "#ffb4ab",
                        "background": "#131313",
                        "surface-container-low": "#1c1b1b",
                        "secondary": "#c8c6c8",
                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#313030",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-variant": "#353534",
                        "surface": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed": "#e4e2e4",
                        "error-container": "#93000a",
                        "outline": "#ad8883",
                        "on-surface-variant": "#e7bdb7",
                        "tertiary-container": "#919092",
                        "surface-tint": "#ffb4aa",
                        "on-secondary-fixed-variant": "#474649",
                        "surface-bright": "#3a3939",
                        "inverse-primary": "#c0000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-desktop": "24px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["10px", { "lineHeight": "12px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar - Linear flow, suppressed for specific content but keeping brand presence -->
<header class="fixed top-0 w-full z-50 bg-background flex justify-between items-center h-16 px-margin-mobile">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary font-headline-md" data-weight="fill">videocam</span>
<span class="font-headline-md text-headline-md font-bold text-primary">VTalk</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-16 pb-safe px-margin-mobile">
<div class="w-full max-w-md w-full bg-surface-container rounded-xl p-stack-lg border border-surface-container-highest flex flex-col items-center gap-stack-lg shadow-sm">
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">Set up your profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Add a photo and your details to get started.</p>
</div>
<!-- Profile Photo Placeholder -->
<div class="relative group cursor-pointer mt-stack-md">
<div class="w-32 h-32 rounded-full bg-surface-container-high border-2 border-surface-container-highest overflow-hidden flex items-center justify-center transition-colors duration-200 group-hover:border-primary-container">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary-container transition-colors duration-200">person</span>
</div>
<!-- Edit Badge -->
<div class="absolute bottom-0 right-0 w-10 h-10 bg-surface-bright rounded-full flex items-center justify-center border-2 border-surface-container shadow-md group-hover:bg-primary-container transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface text-[20px]">edit</span>
</div>
</div>
<!-- Input Fields Form -->
<form class="w-full flex flex-col gap-stack-md mt-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest pl-1" for="name">Display Name</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">badge</span>
<input class="w-full bg-surface-dim border border-surface-container-highest rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-200 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="name" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest pl-1" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full bg-surface-dim border border-surface-container-highest rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-200 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="mt-stack-lg w-full bg-[#FF3B30] hover:bg-[#FF3B30]/90 text-white rounded-lg py-3 px-4 font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98]" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Navigation Shell suppressed for transactional onboarding flow as per instructions -->
</body></html>
