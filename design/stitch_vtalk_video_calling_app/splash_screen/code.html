<style>
        @keyframes slide {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(200%); }
            100% { transform: translateX(-100%); }
        }
    </style>
<script>
        // Simple entrance animation logic if needed, though mostly handled by CSS
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.getElementById('splash-content');
            // Ensure initial state is set
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            // Trigger animation shortly after load
            setTimeout(() => {
                content.style.transition = 'opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 100);
            
            // Example redirect logic for a real app (commented out)
