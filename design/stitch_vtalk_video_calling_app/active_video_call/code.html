<!-- Minimal JavaScript for interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle Logic for Mute
            const btnMute = document.getElementById('btn-mute');
            let isMuted = false;
            btnMute.addEventListener('click', () => {
                isMuted = !isMuted;
                const icon = btnMute.querySelector('span');
                const bg = btnMute.querySelector('div');
                
                if (isMuted) {
                    icon.textContent = 'mic_off';
                    icon.classList.add('text-[#FF3B30]');
                    bg.classList.add('bg-surface-container-high');
                } else {
                    icon.textContent = 'mic';
                    icon.classList.remove('text-[#FF3B30]');
                    bg.classList.remove('bg-surface-container-high');
                }
            });

            // Toggle Logic for Camera
            const btnCamera = document.getElementById('btn-camera');
            let isCameraOff = false;
            btnCamera.addEventListener('click', () => {
                isCameraOff = !isCameraOff;
                const icon = btnCamera.querySelector('span');
                const bg = btnCamera.querySelector('div');
                const pip = document.getElementById('pip-window');
                
                if (isCameraOff) {
                    icon.textContent = 'videocam_off';
                    icon.classList.add('text-on-surface-variant');
                    pip.style.opacity = '0.5';
                    pip.style.filter = 'grayscale(100%)';
                } else {
                    icon.textContent = 'videocam';
                    icon.classList.remove('text-on-surface-variant');
                    pip.style.opacity = '1';
                    pip.style.filter = 'none';
                }
            });

            // Simple drag logic for PiP (desktop simulation)
            const pip = document.getElementById('pip-window');
            let isDragging = false;
            let startX, startY, initialX, initialY;

            pip.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = pip.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                pip.style.transition = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                pip.style.left = `${initialX + dx}px`;
                pip.style.top = `${initialY + dy}px`;
                pip.style.right = 'auto'; // release right constraint
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                pip.style.transition = 'transform 0.2s ease-out';
            });
        });
    </script>
