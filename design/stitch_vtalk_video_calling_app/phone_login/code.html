<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VTalk - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-secondary": "#303032",
                            "primary": "#ffb4aa",
                            "tertiary-fixed-dim": "#c8c6c8",
                            "secondary-container": "#474649",
                            "outline-variant": "#5d3f3b",
                            "on-tertiary-fixed-variant": "#474649",
                            "on-tertiary-container": "#29292b",
                            "surface-container-highest": "#353534",
                            "primary-container": "#ff5545",
                            "primary-fixed-dim": "#ffb4aa",
                            "on-tertiary": "#303032",
                            "on-error": "#690005",
                            "on-primary": "#690003",
                            "on-primary-fixed": "#410001",
                            "on-primary-fixed-variant": "#930005",
                            "on-background": "#e5e2e1",
                            "inverse-surface": "#e5e2e1",
                            "surface-dim": "#131313",
                            "on-surface": "#e5e2e1",
                            "surface-container": "#201f1f",
                            "on-secondary-container": "#b6b4b7",
                            "primary-fixed": "#ffdad5",
                            "on-secondary-fixed": "#1b1b1d",
                            "tertiary": "#c8c6c8",
                            "on-primary-container": "#5c0002",
                            "error": "#ffb4ab",
                            "background": "#131313",
                            "surface-container-low": "#1c1b1b",
                            "secondary": "#c8c6c8",
                            "tertiary-fixed": "#e4e2e4",
                            "on-tertiary-fixed": "#1b1b1d",
                            "on-error-container": "#ffdad6",
                            "surface-container-high": "#2a2a2a",
                            "inverse-on-surface": "#313030",
                            "secondary-fixed-dim": "#c8c6c8",
                            "surface-variant": "#353534",
                            "surface": "#131313",
                            "surface-container-lowest": "#0e0e0e",
                            "secondary-fixed": "#e4e2e4",
                            "error-container": "#93000a",
                            "outline": "#ad8883",
                            "on-surface-variant": "#e7bdb7",
                            "tertiary-container": "#919092",
                            "surface-tint": "#ffb4aa",
                            "on-secondary-fixed-variant": "#474649",
                            "surface-bright": "#3a3939",
                            "inverse-primary": "#c0000a"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "unit": "4px",
                            "margin-desktop": "24px",
                            "stack-md": "16px",
                            "stack-lg": "24px",
                            "margin-mobile": "16px",
                            "stack-sm": "8px",
                            "gutter": "12px"
                    },
                    "fontFamily": {
                            "headline-lg-mobile": ["Inter"],
                            "label-md": ["Inter"],
                            "headline-lg": ["Inter"],
                            "headline-md": ["Inter"],
                            "label-sm": ["Inter"],
                            "body-lg": ["Inter"],
                            "body-md": ["Inter"]
                    },
                    "fontSize": {
                            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                            "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "500"}],
                            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]

                }
            }
        }
    </script>
<style>
        /* Custom styles for glow effect and smooth transitions */
        .premium-glow {
            box-shadow: 0 0 40px -10px rgba(255, 59, 48, 0.15);
        }
        
        .input-focus-ring:focus-within {
            border-color: #FF3B30;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified for transactional screen - minimal) -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background h-16 px-margin-mobile flex justify-between items-center flat no shadows">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary font-headline-md text-headline-md font-bold" data-icon="videocam">videocam</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">VTalk</span>
</div>
<!-- Intentionally omitting trailing avatar for login screen -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pt-16 pb-safe w-full max-w-md mx-auto">
<!-- Welcome Hero Section -->
<div class="w-full text-center mb-stack-lg flex flex-col items-center relative">
<!-- Subtle background glow behind the logo area -->
<div class="absolute inset-0 bg-primary-container opacity-10 blur-3xl rounded-full w-32 h-32 mx-auto -z-10 premium-glow"></div>
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center mb-stack-md border border-[#2C2C2E]">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="videocam" style="font-variation-settings: 'FILL' 1;">videocam</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm tracking-tight">
                Welcome to VTalk
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Enter your phone number to get started. We'll send you a verification code.
            </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-md" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Phone Input Field -->
<div class="flex flex-col gap-unit w-full">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="phone">Phone Number</label>
<div class="flex bg-surface-container-low border border-[#2C2C2E] rounded-lg overflow-hidden transition-colors duration-200 input-focus-ring focus-within:border-[#FF3B30] focus-within:ring-1 focus-within:ring-[#FF3B30]/20 h-14">
<!-- Country Code Selector (Simplified visually for the dark theme) -->
<div class="relative flex items-center bg-surface border-r border-[#2C2C2E] px-3 cursor-pointer hover:bg-surface-container transition-colors">
<select aria-label="Country Code" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer text-on-surface bg-surface border-none">
<option value="+1">United States (+1)</option>
<option value="+44">United Kingdom (+44)</option>
<option value="+91">India (+91)</option>
<option value="+61">Australia (+61)</option>
</select>
<div class="flex items-center gap-1 pointer-events-none text-on-surface font-body-lg text-body-lg">
<span>🇺🇸</span>
<span class="ml-1">+1</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm ml-1" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Number Input -->
<input autocomplete="tel" class="flex-1 bg-transparent border-none text-on-surface font-body-lg text-body-lg px-4 py-0 focus:ring-0 placeholder:text-on-surface-variant/50 w-full" id="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Primary Action Button -->
<button class="w-full h-14 flex items-center justify-center gap-2 bg-[#FF3B30] text-white font-label-md text-label-md rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all duration-200" type="submit">
                Continue
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Legal / Terms Note -->
<div class="mt-stack-lg text-center px-4">
<p class="font-label-sm text-label-sm text-on-surface-variant/70 leading-relaxed">
                    By continuing, you agree to VTalk's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>. Standard message and data rates may apply.
                </p>
</div>
</form>
</main>
<!-- 
      Note: Navigation shell (BottomNavBar) is intentionally suppressed here 
      following the "Linear/Transactional" rule in the Design System Prompt 
      for login screens. 
    -->
</body></html>
